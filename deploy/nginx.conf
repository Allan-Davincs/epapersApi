# Replace api.example.com and certificate paths; install in sites-available.
# The firewall must admit HTTPS only from Cloudflare networks (and operator SSH).
server {
    listen 443 ssl;
    server_name api.example.com;
    ssl_certificate /etc/ssl/epapers/fullchain.pem;
    ssl_certificate_key /etc/ssl/epapers/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    server_tokens off;
    # No raw request URL/query in logs: reset tokens and signed URLs are secrets.
    access_log off;
    error_log /var/log/nginx/epapers-error.log crit;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
    }
    location / { return 404; }
}
