name: API checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: docker run -d --name crdb -p 26257:26257 cockroachdb/cockroach:v25.1.0 start-single-node --insecure
      - run: for i in $(seq 1 30); do docker exec crdb ./cockroach sql --insecure -e 'CREATE DATABASE IF NOT EXISTS epapers_test' && break; sleep 2; done
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://root@localhost:26257/epapers_test?sslmode=disable
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://root@localhost:26257/epapers_test?sslmode=disable
      - run: npm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
